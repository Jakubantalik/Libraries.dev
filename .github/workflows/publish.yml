name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        default: liquid-gooey
        type: choice
        options:
          - liquid-gooey
          - border-beam
          - thinking-orbs
          - metal-fx
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # A release event carries no inputs, so that path keeps publishing
      # border-beam — what this workflow did before gooey joined the repo.
      PKG: ${{ inputs.package || 'border-beam' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # The workspace's own prepublishOnly builds dist before packing, so a
      # publish can't ship a stale or missing build.
      - name: Publish
        run: npm publish -w "$PKG" --access public
        env:
          # One npm token per package, so a leak can't reach the other.
          NODE_AUTH_TOKEN: >-
            ${{ (inputs.package || 'border-beam') == 'liquid-gooey' && secrets.GOOEY
             || (inputs.package || 'border-beam') == 'thinking-orbs' && secrets.ORBS
             || (inputs.package || 'border-beam') == 'metal-fx' && secrets.METAL2
             || secrets.BEAM2 }}
