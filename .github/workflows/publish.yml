name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        default: liquid-gooey
        type: choice
        options:
          - liquid-gooey
          - border-beam
          - thinking-orbs
          - metal-fx
          - voice-glow
          - bot-avatars
          - img-fx
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # A release event carries no inputs: the package comes from the tag,
      # "<package>@<version>" (voice-glow@0.2.0). A bare "v1.3.0" tag is the
      # border-beam convention from before the other libraries joined.
      PKG: ${{ inputs.package || (contains(github.event.release.tag_name, '@') && github.event.release.tag_name || 'border-beam@') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # The tag's "<package>@<version>" collapses to the package name; a
      # version the registry already has is skipped, so a release made
      # after a manual publish (or a re-run) doesn't fail on it.
      - name: Resolve package
        id: pkg
        run: |
          name="${PKG%%@*}"
          version=$(node -p "require('./packages/$name/package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already on the registry — nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # The workspace's own prepublishOnly builds dist before packing, so a
      # publish can't ship a stale or missing build.
      - name: Publish
        if: steps.pkg.outputs.skip != 'true'
        run: npm publish -w "${{ steps.pkg.outputs.name }}" --access public
        env:
          # One npm token per package, so a leak can't reach the other.
          NODE_AUTH_TOKEN: >-
            ${{ steps.pkg.outputs.name == 'liquid-gooey' && secrets.GOOEY
             || steps.pkg.outputs.name == 'thinking-orbs' && secrets.ORBS
             || steps.pkg.outputs.name == 'metal-fx' && secrets.METAL2
             || secrets.BEAM2 }}
