name: Unpublish from npm

# Removes one version of a package from the registry with the same tokens
# the publish workflow uses. npm allows this freely for 72 hours after a
# publish, and after that only while nothing depends on the package.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package name
        required: true
        type: string
      version:
        description: Version to remove
        required: true
        type: string

permissions:
  contents: read

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Unpublish
        run: npm unpublish "${{ inputs.package }}@${{ inputs.version }}" --force
        env:
          NODE_AUTH_TOKEN: >-
            ${{ inputs.package == 'liquid-gooey' && secrets.GOOEY
             || inputs.package == 'thinking-orbs' && secrets.ORBS
             || inputs.package == 'metal-fx' && secrets.METAL2
             || secrets.BEAM2 }}
