<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mood recognition kit playground</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #070707; color: #f8f8f8; font: 14px/1.4 Inter, system-ui, sans-serif; }
      .pay { display: grid; gap: 19px; width: 338px; }
      .pay button { height: 48px; border: 0; border-radius: 999px; background: #f8f8f8; color: #0d0d0d; font: 500 15px/1 inherit; cursor: pointer; user-select: none; transition: opacity 600ms; }
      .pay button:disabled { opacity: 0.4; cursor: not-allowed; }
      .pay[data-state="2"] button:disabled, .pay[data-state="3"] button:disabled { opacity: 0.2; }
      .terms { display: flex; gap: 9px; align-items: center; color: #8f8f8f; font-size: 13px; transition: color 600ms; cursor: pointer; }
      .pay[data-state="3"] .terms { color: #e8e8e8; }
      pre { position: fixed; left: 16px; bottom: 16px; margin: 0; color: #8f8f8f; font: 11px/1.5 ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
