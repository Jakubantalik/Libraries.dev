name: BotAvatarsDemo
options:
  bundleIdPrefix: com.jakubantalik
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  BotAvatarsKit:
    path: ../BotAvatarsKit

targets:
  BotAvatarsDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: BotAvatarsKit
        product: BotAvatarsKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bot avatars
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        PRODUCT_BUNDLE_IDENTIFIER: com.jakubantalik.BotAvatarsDemo
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
