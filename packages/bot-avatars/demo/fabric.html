  <title>bot-avatars — fabric and wear</title>
  <style>
    body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: #111; color: #ddd; }

    .row { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; align-items: center; background: #171717; }
    .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .cell .label { font-size: 11px; opacity: .6 }
    h2 { font-size: 12px; font-weight: 500; margin: 18px 20px 6px; opacity: .6 }
