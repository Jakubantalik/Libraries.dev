<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="dark light" />
  <title>Voice on a phone | Libraries.dev</title>
  <link rel="stylesheet" href="/assets/site.css" />
  <link rel="stylesheet" href="/assets/examples.css" />
  <style>
    /* A phone test page for the Voice effect: the Studio bench is desktop
       only, so this renders the same mocks full screen with the demo
       voice, a processing toggle and both themes. Not linked from the
       site. */
    html, body { margin: 0; height: 100%; background: #070707; overflow: hidden; }
    html[data-theme="light"], html[data-theme="light"] body { background: #f0f0f0; }
    #root { height: 100%; }
    .vp { position: relative; height: 100dvh; display: flex; align-items: center; justify-content: center; }
    /* The controls sit at the top: the glow lives along the bottom edge. */
    .vp-bar {
      position: fixed; left: 0; right: 0; top: 0; z-index: 20;
      display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
      padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
      background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      font: 500 12px/1 Inter, system-ui, sans-serif;
    }
    html[data-theme="light"] .vp-bar { background: rgba(255, 255, 255, 0.7); }
    .vp-bar button {
      height: 30px; padding: 0 12px; border: 0; border-radius: 30px; cursor: pointer; font: inherit;
      background: rgba(255, 255, 255, 0.1); color: #eaeaea;
    }
    html[data-theme="light"] .vp-bar button { background: rgba(0, 0, 0, 0.06); color: #1a1a1a; }
    .vp-bar button[aria-pressed="true"] { background: #eaeaea; color: #111; }
    html[data-theme="light"] .vp-bar button[aria-pressed="true"] { background: #111; color: #fff; }
    .vp-fps { position: fixed; top: calc(62px + env(safe-area-inset-top)); right: 10px; z-index: 20; font: 500 11px/1 ui-monospace, monospace; color: rgba(255,255,255,0.55); }
    html[data-theme="light"] .vp-fps { color: rgba(0,0,0,0.5); }
    /* The phone mock takes the real screen: no crop wrapper, no fixed size. */
    .vp .mock-phone { width: 100vw; height: 100dvh; border-radius: 0; }
    .vp .mock-phone-row { left: max(24px, env(safe-area-inset-left)); right: max(24px, env(safe-area-inset-right)); top: auto; bottom: calc(40px + env(safe-area-inset-bottom)); }
    .vp .mock-phone-text { bottom: calc(150px + env(safe-area-inset-bottom)); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/voice-phone.tsx"></script>
</body>
</html>
