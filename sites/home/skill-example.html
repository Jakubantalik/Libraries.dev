<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="dark" />
  <title>Skill demo · Libraries.dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/site.css" />
  <link rel="stylesheet" href="/assets/examples.css" />
  <style>
    /* The skill page's compare panes embed this page twice: plain
       (?style=generic) and built with the skill. The rows are the skill
       demo page's prototypes (skill-demo.html, Figma 1635:1035) with
       that page's styling, on its #070707 ground. */
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    body { color: #ebebeb; font-family: Inter, var(--font-sans); }
    p { margin: 0; }
    .sx-card {
      box-sizing: border-box;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      border-radius: 14px;
      background: #070707;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    }
    /* Fixed row heights (the taller of each pair), so both panes stack to
       the same height and every row lines up across the compare. */
    .sx-col {
      width: 270px;
      max-width: 100%;
      display: grid;
      grid-template-rows: 58px 22px 40px 24px 48px;
      row-gap: 44px;
      align-items: center;
      justify-items: start;
    }

    .sd-input {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 270px;
      height: 58px;
      padding: 0 10px 0 23px;
      border: 1px solid rgba(44, 47, 54, 0.52);
      border-radius: 60px;
      background: rgba(29, 29, 29, 0.7);
      box-shadow: inset 0 0 50px 0 rgba(255, 255, 255, 0.02);
    }
    .sd-input-field {
      flex: 1;
      min-width: 0;
      height: 100%;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #ebebeb;
      caret-color: #ebebeb;
      font: 400 14px/16px Inter, var(--font-sans);
    }
    .sd-input-field::placeholder { color: #4e4e4e; }
    .sd-input-send {
      display: grid;
      place-items: center;
      flex: none;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 0;
      border-radius: 36px;
      background: rgba(255, 255, 255, 0.04);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.02),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.04);
      cursor: pointer;
      transition: background-color var(--duration-quick) var(--ease-out), scale var(--duration-quick) var(--ease-out);
    }
    .sd-input-send:hover { background: rgba(255, 255, 255, 0.08); }
    .sd-input-send:active { scale: 0.96; }

    /* Beam hairlines on pill-shaped hosts. The ring is already shaped by
       its own border-radius and mask; the library also clips it with a
       clip-path and the wrapper's rounded overflow, at the very same edge.
       The ring is a composited layer, and Chrome can draw those extra
       rounded clips without anti-aliasing, so the curved ends came out
       stepped. Dropping the redundant clips leaves the smooth edge. */
    .sd-beam { overflow: visible !important; }
    .sd-beam::after { clip-path: none !important; }

    .sd-studio { display: flex; align-items: center; gap: 12px; }
    .sd-studio-label { font-size: 16px; line-height: 16px; font-weight: 500; color: #cfcfcf; }

    .sd-btn {
      position: relative;
      box-sizing: border-box;
      height: 40px;
      padding: 0 20px;
      border: 0;
      border-radius: 36px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.04),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.04),
        inset 0 0 50px 0 rgba(255, 255, 255, 0.02);
      color: #ebebeb;
      font: 500 14px/14px Inter, var(--font-sans);
      white-space: nowrap;
      cursor: pointer;
      transition: background-color var(--duration-quick) var(--ease-out), scale var(--duration-quick) var(--ease-out);
    }
    .sd-btn:hover { background: rgba(255, 255, 255, 0.1); }
    .sd-btn:active { scale: 0.97; }

    .sd-btn:focus-visible,
    .sd-input-send:focus-visible { outline: 2px solid #ededed; outline-offset: 2px; }

    .sd-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      line-height: 14px;
      color: #ebebeb;
    }

    /* Personal assistant. */
    .sd-agent { display: flex; align-items: center; gap: 14px; }
    /* The avatar hops and turns on click, so it reads as clickable. */
    .sd-agent [data-bot-avatar] { cursor: pointer; }
    .sd-agent-text {
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 14px;
      line-height: 14px;
      color: #caccd2;
    }

    /* ── Generic AI: stock effects an agent writes without the skill. */
    .gx-input-glow {
      border-radius: 60px;
      animation: gx-glow 2s ease-in-out infinite alternate;
    }
    @keyframes gx-glow {
      from { box-shadow: 0 0 12px rgba(168, 85, 247, 0.25); }
      to { box-shadow: 0 0 28px rgba(168, 85, 247, 0.55); }
    }

    .gx-badge {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 9px;
      border-radius: 999px;
      background: #fff;
      color: #323232;
      font-size: 12px;
      font-weight: 600;
    }
    .gx-badge::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(0, 0, 0, 0.12) 50%, transparent 70%);
      transform: translateX(-100%);
      animation: gx-shine 2.5s ease-in-out infinite;
    }
    @keyframes gx-shine { 60%, 100% { transform: translateX(100%); } }

    .gx-ping {
      background: rgba(255, 255, 255, 0.16);
      animation: gx-ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    .gx-ping:hover { background: rgba(255, 255, 255, 0.2); }
    @keyframes gx-ping {
      0% {
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.04),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.04),
          0 0 0 0 rgba(139, 92, 246, 0.6);
      }
      100% {
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.04),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.04),
          0 0 0 12px rgba(139, 92, 246, 0);
      }
    }

    .gx-spinner {
      flex: none;
      box-sizing: border-box;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-top-color: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      animation: gx-spin 1s linear infinite;
    }
    @keyframes gx-spin { to { transform: rotate(360deg); } }

    .gx-avatar {
      position: relative;
      flex: none;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      margin: 0 4px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      font-size: 20px;
      line-height: 1;
    }

    @media (prefers-reduced-motion: reduce) {
      .gx-input-glow, .gx-badge::after, .gx-ping, .gx-spinner { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="skill-example-root" style="height: 100%"></div>
  <script type="module" src="/src/skill-example.tsx"></script>
</body>
</html>
